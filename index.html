```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS tự viết -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Khu vực đăng ký -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">

                <div class="register-card">

                    <!-- Tiêu đề -->
                    <div class="text-center mb-4">
                        <h1 class="register-title">Tạo tài khoản</h1>
                        <p class="text-muted">
                            Điền thông tin bên dưới để đăng ký tài khoản mới.
                        </p>
                    </div>

                    <!-- Form đăng ký -->
                    <form id="registerForm">

                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label">
                                Họ và tên
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="fullname"
                                   name="fullname"
                                   placeholder="Nhập họ và tên"
                                   required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="example@gmail.com"
                                   required>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Mật khẩu
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Nhập mật khẩu"
                                   minlength="8"
                                   required>
                            <div class="form-text text-muted">
                                Mật khẩu phải có ít nhất 8 ký tự.
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Xác nhận mật khẩu
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="confirmPassword"
                                   name="confirmPassword"
                                   placeholder="Nhập lại mật khẩu"
                                   required>
                            <div id="passwordMessage" class="form-text"></div>
                        </div>

                        <!-- Giới tính -->
                        <div class="mb-3">
                            <label class="form-label d-block">
                                Giới tính
                            </label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="male"
                                       value="Nam"
                                       required>
                                <label class="form-check-label" for="male">
                                    Nam
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="female"
                                       value="Nữ">
                                <label class="form-check-label" for="female">
                                    Nữ
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input"
                                       type="radio"
                                       name="gender"
                                       id="other"
                                       value="Khác">
                                <label class="form-check-label" for="other">
                                    Khác
                                </label>
                            </div>
                        </div>

                        <!-- Sở thích -->
                        <div class="mb-3">
                            <label class="form-label d-block">
                                Sở thích
                            </label>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="hobbies"
                                       id="reading"
                                       value="Đọc sách">
                                <label class="form-check-label" for="reading">
                                    Đọc sách
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="hobbies"
                                       id="music"
                                       value="Nghe nhạc">
                                <label class="form-check-label" for="music">
                                    Nghe nhạc
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       name="hobbies"
                                       id="sports"
                                       value="Thể thao">
                                <label class="form-check-label" for="sports">
                                    Thể thao
                                </label>
                            </div>
                        </div>

                        <!-- Quốc gia -->
                        <div class="mb-4">
                            <label for="country" class="form-label">
                                Quốc gia
                            </label>

                            <select class="form-select"
                                    id="country"
                                    name="country"
                                    required>
                                <option value="" selected disabled>
                                    -- Chọn quốc gia --
                                </option>
                                <option value="Việt Nam">Việt Nam</option>
                                <option value="Nhật Bản">Nhật Bản</option>
                                <option value="Hàn Quốc">Hàn Quốc</option>
                                <option value="Singapore">Singapore</option>
                                <option value="Hoa Kỳ">Hoa Kỳ</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>

                        <!-- Đồng ý điều khoản -->
                        <div class="form-check mb-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="terms"
                                   required>
                            <label class="form-check-label" for="terms">
                                Tôi đồng ý với các điều khoản sử dụng.
                            </label>
                        </div>

                        <!-- Nút Submit -->
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Đăng ký
                        </button>

                        <p class="text-center text-muted mt-4 mb-0">
                            Đã có tài khoản?
                            <a href="#" class="login-link">Đăng nhập</a>
                        </p>

                    </form>
                </div>

                <!-- Chú thích cuối trang -->
                <p class="text-center text-muted small mt-3">
                    © 2026 Registration Form
                </p>

            </div>
        </div>
    </div>

    <!-- JavaScript kiểm tra form -->
    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const passwordMessage = document.getElementById("passwordMessage");

        // Kiểm tra hai mật khẩu có giống nhau không
        function checkPassword() {
            if (confirmPassword.value === "") {
                passwordMessage.textContent = "";
                confirmPassword.setCustomValidity("");
                return;
            }

            if (password.value !== confirmPassword.value) {
                passwordMessage.textContent = "Mật khẩu xác nhận không khớp.";
                passwordMessage.className = "form-text text-danger";
                confirmPassword.setCustomValidity("Mật khẩu không khớp.");
            } else {
                passwordMessage.textContent = "Mật khẩu khớp.";
                passwordMessage.className = "form-text text-success";
                confirmPassword.setCustomValidity("");
            }
        }

        password.addEventListener("input", checkPassword);
        confirmPassword.addEventListener("input", checkPassword);

        // Xử lý khi nhấn nút Đăng ký
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            checkPassword();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            alert("Kiểm tra thành công! Bạn đã hoàn thành form đăng ký mẫu.");
        });
    </script>

</body>
</html>
